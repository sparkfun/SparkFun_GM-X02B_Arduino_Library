name=SparkFun Qwiic Gas Sensor GM-X02B
version=2.0.0
author=SparkFun Electronics <techsupport@sparkfun.com>
maintainer=SparkFun Electronics <sparkfun.com>
sentence=An Arduino library for the SparkFun Qwiic MEMS gas sensor breakouts built on the Winsen GM-x02B sensor family
paragraph=One library for all nine SparkFun Qwiic MEMS gas sensor boards: GM-102B (NO2), GM-202B (alcohol and smoke), GM-302B (ethanol), GM-402B (methane and propane), GM-502B (VOC), GM-512B (breath odor), GM-602B (hydrogen sulfide, H2S), GM-702B (carbon monoxide, CO) and GM-802B (ammonia, NH3). Reads the Winsen sensing element through the onboard ADC101C021 I2C ADC and provides raw counts, output voltage, sensor resistance, a direction-normalized clean-air gas response, hardware threshold alerts, and hardware peak tracking. Handles the GM-102B's inverted response curve automatically, so one sketch works with any board in the family.
category=Sensors
url=https://github.com/sparkfun/SparkFun_GM-X02B_Arduino_Library
architectures=*
depends=SparkFun Toolkit (>=1.2.0)
